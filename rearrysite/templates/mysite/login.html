{% extends 'mysite/base_auth.html' %}


{% block content %}
    <div class="container">
        <div class="row">
            <div class="col-lg-3 m-auto">
                <h1 class="display-4 font-italic text-center"><a class="text-decoration-none" href="/">ReallySite</a></h1>
            </div>

            <div class="col-lg-3 m-auto">
                <form class="form-signin mx-4" action="" method="post">
                    <div class="text-center">
                        <h1 class="h5 my-4">Login</h1>
                    </div>

                    <div class="form-label-group my-3">
                        <input type="email" name="" id="id_email" class="form-control" placeholder="Email address" required autofocus>
                    </div>

                    <div class="form-label-group my-3">
                        <input type="password" name="" id="id_password" class="form-control" placeholder="Password" required>
                    </div>

                    <button class="btn btn-primary btn-block my-3" type="submit">Sign in</button>
                </form>
            </div>
        </div>
    </div>
{% endblock content %}
